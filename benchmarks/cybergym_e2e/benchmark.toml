# Trinity-required per-benchmark self-describing configuration.
#
# trinity/FORGE.md:184 requires "one self-describing directory per benchmark
# carrying its configuration defaults; an inference entry point and a
# separate evaluation entry point registered on the shared command line; an
# implementation of the shared evaluation interface's three duties".
#
# The [defaults] block below enumerates the configuration defaults per the
# "carrying its configuration defaults" clause.  The shared command-line
# base and the three-duty interface class are follow-ups recorded in
# coverage_gaps and surfaced in EDICT.md until a refactor lands.

[benchmark]
name = "cybergym_e2e"
description = "End-to-end vulnerability discovery, reproduction, and repair tasks derived from CyberGym-E2E, packaged in Harbor delivery format."
task_mode = "e2e"

# Where this benchmark reads resident bundles from. Under the lane-root
# indirection: samples/<uuid>/ for starter and sample task_lane, delivery/<uuid>/
# for delivery. run_harbor.py already resolves absolute paths at the CLI, so
# this is the intended lookup surface.
lane_root_indirection = ["samples", "delivery"]

# Harbor release the bundles conform to; resolves to ../../harbor.lock.
harbor_release_ref = "../../harbor.lock"

[entry_points]
# Interim: both duties live in run_harbor.py at the harness root.  A future
# refactor will register these against a shared command-line base under
# benchmarks/*/plugin.py.
inference = "../../run_harbor.py"
evaluation = "../../run_harbor.py"
report_generator = "../../generate_report.py"

[three_duties]
# trinity/FORGE.md:184 shared-evaluation-interface three duties.  Records
# where each duty currently lives so a refactor has a concrete target; the
# shared-base implementation itself is a follow-up.
prepare_instance = "run_harbor.py::main (task_dir resolution at line 1906)"
prepare_sandbox = "run_harbor.py::build_image and run_agent_container"
evaluate_instance = "run_harbor.py::run_verifier"

[defaults]
# Configuration defaults for this benchmark, derived from run_harbor.py's
# argparse block. Values a fresh invocation uses when the human passes no
# CLI flags and no config/agent.toml override.

timeout_seconds = 5400
max_attempts = 1
pass_at_k = 1

model_provider = "anthropic"
anthropic_model_id = "claude-opus-5"
bedrock_model_id = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
glm_model_id = "glm-5.3"
glm_small_model_id = "glm-5.3-flash"
aws_region = "us-west-2"

judge_provider = "codex"
judge_model = "gpt-5.6-sol"
judge_calibration_model = "gpt-5.6-luna"
judge_trials = 3

output_dir_template = "agent_output/<task>/<model>/<timestamp>_e2e"
evidence_dir_template = "evidence/<task>/<model>/<timestamp>_e2e"
deliverables_dir_default = "deliverables"

isolation_lockdown = true
isolation_shared_network = false
network_mode = "internal_with_bridge_relay"

verifier_reward_json = "/logs/verifier/reward.json"
verifier_reward_txt = "/logs/verifier/reward.txt"
# Reward semantics are contract-bound at `.seed/contract.yaml` reward_schema:
# `judged_channel` and `pytest_score` each occupy the closed interval [0, 1];
# `deterministic_channel` (pytest_score) may go below zero when a negative-
# weight cheat detector fires, and the aggregated reward is their mean.
# `reward_range_min` and `reward_range_max` below cover the effective observed
# span of the reward field emitted in reward.json, INCLUDING that negative
# excursion; a per-channel breakdown lives in the contract's reward_schema.
reward_range_min = -1.0
reward_range_max = 1.0
reward_formula = "mean(pytest_score, rubric_score)"

[externalization]
# trinity/FORGE.md:184 externalized model-configuration surface. The runner
# reads --agent-config <path> and applies TOML values as argparse defaults;
# CLI flags override, so config is the base layer.
agent_config_example = "../../config/agent.example.toml"
agent_config_env_var = "AGENT_CONFIG"
cli_flag = "--agent-config"

[coverage_gaps]
# Each gap here caps at HOLD:PILOT_REQUIRED until resolved.
gaps = [
  "no shared command-line base yet; inference and evaluation collapse into run_harbor.py (finding #2)",
  "no shared evaluation-interface class; the three duties are inlined in run_harbor.py (finding #2)",
  "grading logic (rubric judge in scripts/judge_lib.py) still lives in the harness rather than in the bundle's tests/ (finding #3)",
  "external solver registry not consumed; model choice is a CLI flag or config value, not registry-driven (finding #12)",
]
