# Row states are CANDIDATE | ANCHORED | SUPERSEDED. Lever states are
# ACTIVE | WATCH | EXPIRED | RETIRED. Invariant E23 holds that the hardness
# contract is authored and published evidence, never difficulty evidence: a row
# may be catalogued without any measurement. A row reaches ANCHORED only when a
# verified signed CFER binds it, and a lever reaches ACTIVE only on fresh
# measured failure evidence against a pinned cohort. No CFER exists in this
# project, so every row below is CANDIDATE and every lever state is EXPIRED,
# which is the correct closed state for an unmeasured lever, not a defect.

