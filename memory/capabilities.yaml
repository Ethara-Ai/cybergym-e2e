# ENGRAM Phase 0 step 8a. Per-project opt-in capability block.
# state is exactly one of: default | declared | implemented.
# An undefined `declared` capability is decorative: it never raises a disposition
# and never replaces the default. `implemented` true with `liveness_proven` false
# caps at BROKEN as theater. Honest `implemented: false` is benign.

capabilities:
  model_identity:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "Default policy: provider signatures, registry attestations, and transcript hashes verified against memory/roots.yaml. memory/roots.yaml does not yet exist (Phase 1 output), so the default itself is currently unbacked."

  ledger_integrity:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "Default policy: signed Merkle checkpoints plus byte-identical recovery. No ledger exists yet."

  multi_operator_witness:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "Not declared. A stronger witness network may only be declared with an objective byte-level definition naming exact operators and deterministic confirmation."

  autonomous_gates:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "No gate_approver role and no out-of-band approver are configured. Every gate in this project is human. Matches audit/capabilities.yaml, which records the same default."

  contamination_screening:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "Mandatory floor applies under E29. No corpus-level screening roots are declared and no dataset exists to screen."

  budget_envelope:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "E34: budget is opt-in per project. requirements/ is absent, so no budget is declared and this project carries no budget obligation. Consistent with audit/budget.yaml."

  optimization_lane:
    state: default
    bytes_present: false
    implemented: false
    liveness_proven: false
    notes: "No optimization slots exist. E31 folds only coarse standing, and there is none."

