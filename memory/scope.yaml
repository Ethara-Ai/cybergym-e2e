ambiguities:
  - id: AMB-E-001
    statement: "Whether dataset/ was intentionally retired or lost."
    status: RESOLVED
    resolved_at: "2026-08-18T00:00:00Z"
    resolution: "Retired by design, not lost. dataset.zip preserves the entry with file mode 120755, a symlink pointing at tasks/, and .gitignore ignores tasks/, data/, dataset/, jobs/ and run_logs/. The dataset was a build output of convert_to_harbor.py, whose --out default is ROOT/tasks. The prior audit is therefore re-run against a rebuilt tree, not retracted for data loss."
    resolved_by: inspection
  - id: AMB-E-002
    statement: "Whether CyberGym-E2E is intended to become a full Trinity knowledge repository under ENGRAM genesis Phase G, or to remain an existing project that only vendors trinity/ under README Path B. The two paths scaffold very different trees."
    status: RESOLVED
    resolved_at: "2026-08-20T00:00:00Z"
    resolution: "Path B — vendor only. CyberGym-E2E is an evaluation harness implementing the paper's benchmark, not an original research project. Trinity is vendored as governance tooling for evidence quality tracking. Phase G genesis is not invoked. No paper/, pitch/, media/, patent/, mascot, or full doc-spine scaffolding."
    resolved_by: human

disposition_projection:
  phase_0_outcome: SCOPED
  vocabulary: [CURRENT, STALE, BROKEN]
  projected_ledger_state: STALE
  superseded_projection: BLOCK
  superseded_reason: "BLOCK is not a member of the ENGRAM state vocabulary. The States and dispositions section closes the ledger set to CURRENT, STALE and BROKEN, and states that a value outside these sets is a contract violation rather than a novel state to argue into. SHIP, HOLD and BLOCK belong to CRUCIBLE, and the seven-value SHIP, HOLD and BLOCK family belongs to FORGE."
  basis: "STALE is defined to cover a ledger that honestly carries zero CFERs because no signed proof has landed yet, where no evidence is broken and a missing, expired or overdue cohort registry also holds the ledger here. That is this project exactly."
  not_broken_because: "BROKEN requires signature failure, unverifiable proof, non-identical recompute, mutable provenance, unmeasured or frontier-caught ACTIVE, or inert required Bucket-D machinery. Inert means present but hardcoded to reject every valid input. This project has no ACTIVE lever, no bad evidence, and no inert instrument: its required machinery is not yet built, and the contract states plainly that missing is a coverage gap while inert closes on all evidence and is broken."
  drivers: [GAP-E-006, GAP-E-007]
  note: "This is a projection recorded at scope time, not a graded disposition. ENGRAM emits its disposition in Phase 2, after the Phase 0.5 gate is discharged and Phase 1 has built the ledger."
