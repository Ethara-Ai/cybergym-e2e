  - id: F-009
    title: negative-weight network detection is string-based only
    class: 6
    severity: MEDIUM
    category: scoring_integrity
    evidence: CHK-015
    description: >
      The test_negative_weight_uses_network check in test_output.py only
      searches for string patterns. An agent can use network tools without
      leaving these specific strings, evading detection. Mitigated by
      F-001 resolution (iptables lockdown).
    location: raw_data/*/tests/test_output.py test_negative_weight_uses_network()
    disposition_impact: none

  - id: F-010
    title: shell injection via subprocess with shell=True
    class: 1
    severity: MEDIUM
    category: code_injection
    evidence: code review
    description: >
      The test_output.py verifier uses subprocess.run with shell=True and
      f-string interpolation of file paths. While paths are typically
      controlled and execution is inside Docker containers, a maliciously
      crafted file path could inject shell commands.
    location: raw_data/*/tests/test_output.py lines 88-141
    disposition_impact: none

