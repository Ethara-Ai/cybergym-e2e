findings:

  - id: F-001
    title: network policy not enforced by runner
    class: 2
    severity: HIGH
    category: trust_boundary
    evidence: CHK-014
    status: RESOLVED
    resolved_at: "2026-08-20"
    resolution: >
      lockdown_agent_network() at run_harbor.py line 213 applies iptables rules
      after install_claude_code() completes, blocking all outbound traffic except
      to the API bridge (host.docker.internal). Called at line 1123 before
      run_claude_code_agent(). Network lockdown is active when using the OAuth
      bridge (ANTHROPIC_BASE_URL pointing at host.docker.internal).
    disposition_impact: none

