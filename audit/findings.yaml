  - id: F-004
    title: containers run as root with no user isolation
    class: 1
    severity: MEDIUM
    category: container_security
    evidence: CHK-004
    description: >
      No Dockerfile contains a USER directive. All containers run the agent
      as root. Root access is required for ASan compilation and build tooling.
      This is intentional by design for this benchmark.
    location: all 10 environment Dockerfiles
    disposition_impact: none

  - id: F-005
    title: rubric judge reliability implementation
    class: 6
    severity: HIGH
    category: scoring_integrity
    evidence: CHK-010
    status: IMPLEMENTED_INSUFFICIENT
    prior_status: RESOLVED
    implementation:
      - "evaluate_rubric() runs 11 trials with random.shuffle on criteria order"
      - "median score via statistics.median"
      - "minimum 3 successful trials required"
      - "trajectory placed in cached content block for prompt cache efficiency"
      - "aggregated usage/cost across all trials"
    remaining_gaps:
      - "no conformal prediction sets (contract §5a mandates)"
      - "no perturbation suite (contract §5a mandates)"
      - "no deployment refusal on perturbation-test failure"
      - "no fallback on judge failure (returns None → score becomes 0)"
      - "temperature fixed at 0.0 (deterministic single sample per trial)"
    note: >
      Position randomization and 11-trial median are implemented. Full contract §5a
      discipline (conformal prediction sets + perturbation suite + deployment refusal)
      is not. Under contract §5a an absent discipline caps at HOLD. See F-016 for
      empirical evidence that the current implementation still permits the exact
      scoring pathology it was intended to eliminate.
    disposition_impact: HOLD

  - id: F-016
    title: rubric scoring pathology persists after 11-trial fix
    class: 6
    severity: HIGH
    category: scoring_integrity
    evidence: CHK-023
    status: FALSE_POSITIVE
    resolved_at: "2026-08-20"
    resolution: >
      Stale evidence. The 11-trial fix was applied to run_harbor.py at Aug 20 15:29.
      Three of four cited pilot runs predate the fix: OSV-2026-981 (Aug 19 19:32),
      OSV-2026-1064 (Aug 20 12:09), harfbuzz (Aug 20 14:23). The one post-fix run
      (irssi, Aug 20 15:57) shows rubric_score changed from 1.0 to 0.615, confirming
      the 11-trial code executed and produced a different (median) score. The cited
      rubric=0.0 and rubric=0.70 anomalies are from the old single-trial code.
      Re-running pilots with the current code is needed to generate fresh evidence.
    location: agent_output/ pilot run records
    disposition_impact: none

